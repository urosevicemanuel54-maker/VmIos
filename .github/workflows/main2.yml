name: VirtualiOS - Stage 2 ARM64 TCI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS app with QEMU TCI
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and package app
        run: |
          bash scripts/build-ios.sh

      - name: Verify QEMU engine
        run: |
          test -n "$(find build/VirtualiOS-QEMU -type f -name '*.dylib' -print -quit)"
          file build/VirtualiOS-QEMU/*.dylib

      - name: Verify IPA
        run: |
          test -s build/VirtualiOS-unsigned.ipa
          unzip -l build/VirtualiOS-unsigned.ipa
          du -h build/VirtualiOS-unsigned.ipa

      - name: Upload Stage 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualiOS-Stage2
          path: build/VirtualiOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload QEMU TCI engine
        uses: actions/upload-artifact@v4
        with:
          name: VirtualiOS-QEMU-TCI-iOS-arm64
          path: build/VirtualiOS-QEMU/*.dylib
          if-no-files-found: error
          retention-days: 14
